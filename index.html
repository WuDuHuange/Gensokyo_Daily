<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幻想乡日报 — Gensokyo Daily</title>
  <meta name="description" content="幻想乡日报 — 射命丸文主编，聚合东方 Project 官方消息与社区热点的新闻日报。" />
  <meta name="keywords" content="东方Project, Touhou, 幻想乡, Gensokyo, 日报, 射命丸文" />

  <!-- 尽早打上 js 标记：入场动效只在脚本可用时启用，否则内容直接可见 -->
  <script>document.documentElement.classList.add('js');</script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap"
    rel="stylesheet" />

  <!-- Tailwind Output -->
  <link rel="stylesheet" href="css/output.css" />

  <!-- JS 被完全禁用时立即摘掉遮罩（CSS 里另有 3 秒兜底，覆盖 JS 报错的情况） -->
  <noscript>
    <style>
      #loading-overlay {
        display: none !important;
      }
    </style>
  </noscript>
</head>

<body class="font-body text-ink antialiased bg-paper-texture leading-relaxed">

  <!-- ============ 图标精灵 ============
       全站图标统一收在这里，HTML 与 JS 都用 <use href="#i-xxx"> 引用同一批定义，
       避免「静态标记里画一遍、渲染函数里再画一遍」的双份维护。

       为什么不用 emoji：20+ 个彩色 emoji 散在一张单色报纸上，是「像不像报纸」
       最直接的破绽。改用 1.5px 描边线性图标后，颜色只剩「墨」一个来源
       （stroke: currentColor），深浅主题自动跟随，不需要为夜间单独调色。

       唯一的例外是天气：它的 emoji 承担实际语义（晴/雨/雾/雪），面积小、
       且 .weather-icon 已显式指定 emoji 字体栈，保留。
       参考图：24×24 网格，统一 stroke-width 1.5，见 css/input.css 的 .icon。 -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-newspaper" viewBox="0 0 24 24">
      <path d="M4 6a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6Z" />
      <path d="M16 9h3a1 1 0 0 1 1 1v7a2 2 0 0 1-2 2" />
      <path d="M7 9h6M7 12h6M7 15h4" />
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M9.5 3.5h5l-.8 5.2 3 3.1H7.3l3-3.1-.8-5.2Z" />
      <path d="M12 11.8V21" />
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24">
      <rect x="3" y="4.5" width="18" height="12.5" rx="2" />
      <path d="M8 17v4.2L12.6 17" />
    </symbol>
    <symbol id="i-art" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <circle cx="8.5" cy="9.5" r="1.6" />
      <path d="M21 15.5 16 10.5l-6.5 6.5-2-2L3 19" />
    </symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24">
      <rect x="5" y="4.5" width="14" height="16.5" rx="2" />
      <path d="M9.5 4.5V3.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1" />
      <path d="M9 11h6M9 14.5h6M9 18h3.5" />
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24">
      <path d="M9.5 17.5V6.2l9.5-2v11.3" />
      <circle cx="6.5" cy="17.5" r="3" />
      <circle cx="16" cy="15.5" r="3" />
    </symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4v-5Z" />
      <path d="M16.5 10 21 15M21 10l-4.5 5" />
    </symbol>
    <symbol id="i-sound-on" viewBox="0 0 24 24">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4v-5Z" />
      <path d="M16 9.2a4.2 4.2 0 0 1 0 5.6" />
      <path d="M18.8 6.6a8 8 0 0 1 0 10.8" />
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3Z" />
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" />
    </symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24">
      <path d="M12 20V4.5M5.5 11 12 4.5 18.5 11" />
    </symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24">
      <path d="M5.5 4.5h13L21 11.5v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6l2.5-7Z" />
      <path d="M3 11.5h5l2 3h4l2-3h5" />
    </symbol>
    <symbol id="i-map-pin" viewBox="0 0 24 24">
      <path d="M12 21.5s7-6.4 7-11.3a7 7 0 1 0-14 0c0 4.9 7 11.3 7 11.3Z" />
      <circle cx="12" cy="10" r="2.6" />
    </symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9l-3.8 3.8Z" />
    </symbol>
    <symbol id="i-pill" viewBox="0 0 24 24">
      <g transform="rotate(-45 12 12)">
        <rect x="4" y="8.5" width="16" height="7" rx="3.5" />
        <path d="M12 8.5v7" />
      </g>
    </symbol>
    <symbol id="i-store" viewBox="0 0 24 24">
      <path d="M4 9.5V6l1.8-3h12.4L20 6v3.5" />
      <path d="M4 9.5a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0" />
      <path d="M5 12v8.5h14V12" />
      <path d="M9.5 20.5v-5h5v5" />
    </symbol>
    <symbol id="i-torii" viewBox="0 0 24 24">
      <path d="M2 6h20" />
      <path d="M5.2 6 4 10h16l-1.2-4" />
      <path d="M8 10v11M16 10v11" />
      <path d="M12 10v3.5" />
    </symbol>
    <symbol id="i-tv" viewBox="0 0 24 24">
      <rect x="3" y="7" width="18" height="13" rx="2" />
      <path d="M8 3.5 12 7.5l4-4" />
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M12 7.2C10.5 5.7 8 5.1 5 5.1v12.4c3 0 5.5.6 7 2.1 1.5-1.5 4-2.1 7-2.1V5.1c-3 0-5.5.6-7 2.1Z" />
      <path d="M12 7.2v12.4" />
    </symbol>
    <symbol id="i-dots" viewBox="0 0 24 24">
      <circle cx="5.5" cy="12" r="1.1" />
      <circle cx="12" cy="12" r="1.1" />
      <circle cx="18.5" cy="12" r="1.1" />
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
    </symbol>
    <symbol id="i-beer" viewBox="0 0 24 24">
      <path d="M5 5.5h9.5v13a1.5 1.5 0 0 1-1.5 1.5H6.5A1.5 1.5 0 0 1 5 18.5v-13Z" />
      <path d="M14.5 9h2.2a1.8 1.8 0 0 1 1.8 1.8v4.4a1.8 1.8 0 0 1-1.8 1.8h-2.2" />
      <path d="M7.5 5.5V3h5v2.5" />
    </symbol>
  </svg>

  <!-- 无脚本时说明为什么版面是空的，避免用户对着骨架发懵 -->
  <noscript>
    <div class="noscript-banner">
      本报需要启用 JavaScript 才能取回当日新闻，当前显示的是空白版面。
    </div>
  </noscript>

  <!-- ============ 滚动进度 · 一根墨线 ============ -->
  <div class="scroll-progress" aria-hidden="true">
    <div class="scroll-progress__bar" id="scroll-progress-bar"></div>
  </div>

  <!-- ============ 纸张容器 ============ -->
  <div class="newspaper max-w-[1280px] mx-auto my-8 bg-paper px-6 py-8 md:px-12 md:py-10 shadow-paper border relative">

    <!-- ============ 报头 ============ -->
    <header class="text-center pb-4 relative mb-8">
      <div class="flex justify-between items-center text-sm text-ink-2 font-body mb-3 border-b border-ink/25 pb-1.5">
        <span id="edition-date" class="font-bold">第 00000000 期</span>
        <span id="header-weather">博丽神社 ☀️ 25°C</span>
      </div>

      <!-- 刊头装饰墨线，从中间向两端展开 -->
      <div class="flex items-center gap-3 md:gap-6 mb-2">
        <span class="masthead-ornament__line" style="--d:200ms"></span>
        <span class="font-title text-ink-2 text-xs md:text-sm tracking-[0.35em] whitespace-nowrap">文 々 新 聞</span>
        <span class="masthead-ornament__line" style="--d:200ms"></span>
      </div>

      <!-- 报头刊名：宋体特粗，不是毛笔行书。
           真报纸的刊头是宋体/黑体特粗压出来的，毛笔行书更像店铺招牌；
           而且手写体的笔画外扩会和上方注音打架。手写体保留给副标与首字下沉。 -->
      <h1 class="font-heading text-[2.4rem] md:text-7xl font-black leading-[1.2] text-ink my-4 masthead-title ink-in ink-in--masthead" style="--d:80ms">
        <ruby>幻想乡日报<rp>(</rp><rt class="text-[0.3em] tracking-[0.2em] text-ink-2">げんそうきょうにっぽう</rt><rp>)</rp></ruby>
      </h1>

      <div class="flex flex-col md:flex-row justify-between items-center md:items-baseline text-xs md:text-sm text-ink-2 mb-2 gap-2 md:gap-0 ink-in" style="--d:300ms">
        <span class="font-mono text-base tracking-[0.3em] uppercase text-ink-2">GENSOKYO DAILY</span>
        <span class="text-ink-3 text-xs">主编：射命丸 文 ｜ 排版：鸦天狗印刷所</span>
      </div>

      <div class="h-1 bg-ink border-b border-ink mt-1 w-full"></div>
    </header>

    <!-- ============ 天气带 ============
         旧版是 8 个带 border 的格子，远看像后台数据表格。现在是一条横向带。 -->
    <section class="mb-10" id="weather-bar">
      <div class="flex items-baseline gap-2 mb-2">
        <span class="font-heading text-xs font-bold tracking-widest text-ink-2">气象</span>
        <span class="font-mono text-[0.6rem] text-ink-3 tracking-widest">WEATHER</span>
      </div>
      <div class="weather-strip" id="weather-grid">
        <!-- JS 动态填充 -->
      </div>
    </section>

    <!-- ============ 头版要闻 ============ -->
    <section class="mb-14" id="section-official">
      <div class="font-heading text-section font-black border-b-[4px] border-double border-ink pb-1.5 mb-7 flex items-baseline gap-2.5 section-divider-ornament">
        <svg class="icon icon--lg"><use href="#i-newspaper" /></svg> 头版要闻
        <span class="font-mono text-meta text-ink-3 tracking-widest uppercase ml-auto">HEADLINES</span>
      </div>
      <div id="container-official">
        <!-- JS 动态填充 -->
        <div class="p-8 text-center text-ink-2 animate-pulse">
          正在通过天狗急件获取最新资讯...
        </div>
      </div>
    </section>

    <!-- ============ 简讯 ============
         报纸的简讯栏只给标题、不给摘要。头版要闻之外的条目都落在这里。 -->
    <section class="mb-14" id="section-brief">
      <div class="font-heading text-section font-black border-b-[4px] border-double border-ink pb-1.5 mb-7 flex items-baseline gap-2.5 section-divider-ornament">
        <svg class="icon icon--lg"><use href="#i-pin" /></svg> 简讯
        <span class="font-mono text-meta text-ink-3 tracking-widest uppercase ml-auto">IN BRIEF</span>
      </div>
      <div class="brief-grid brief-grid--dense" id="container-brief"></div>
    </section>

    <!-- ============ 社会·民生 ============ -->
    <section class="mb-14" id="section-community">
      <div class="font-heading text-section font-black border-b-[4px] border-double border-ink pb-1.5 mb-7 flex items-baseline gap-2.5 section-divider-ornament">
        <svg class="icon icon--lg"><use href="#i-chat" /></svg> 社会·民生
        <span class="font-mono text-meta text-ink-3 tracking-widest uppercase ml-auto">COMMUNITY</span>
      </div>
      <!-- 容器本身不再带 .brief-grid：这个分类改由 app.js 输出
           「3 条带图卡 + 其余标题流」两段结构，多栏由内层元素自己声明。 -->
      <div id="container-community"></div>
    </section>

    <!-- ============ 副刊·剪报 ============ -->
    <section class="mb-14" id="section-art">
      <div class="font-heading text-section font-black border-b-[4px] border-double border-ink pb-1.5 mb-7 flex items-baseline gap-2.5 section-divider-ornament">
        <svg class="icon icon--lg"><use href="#i-art" /></svg> 副刊·剪报
        <span class="font-mono text-meta text-ink-3 tracking-widest uppercase ml-auto">ART &amp; CULTURE</span>
      </div>
      <div id="container-art"></div>
    </section>

    <!-- ============ 分类广告 ============ -->
    <!-- 这个板块此前完全不存在：app.js 的 renderAds() 一直在找 #ads-grid，
         取不到就 return，4 条广告数据从没被渲染过。 -->
    <section class="mt-12 mb-4" id="section-ads">
      <div class="font-heading text-2xl font-black border-b-[4px] border-double border-ink pb-1 mb-8 flex items-baseline gap-2 section-divider-ornament">
        <svg class="icon icon--lg"><use href="#i-clipboard" /></svg> 分类广告
        <span class="font-mono text-[0.65rem] text-ink-3 tracking-widest uppercase ml-auto">CLASSIFIEDS</span>
      </div>
      <div class="ads-grid" id="ads-grid">
        <!-- JS 动态填充 -->
      </div>
    </section>

    <!-- ============ 页脚 ============ -->
    <footer class="text-center pt-8 border-t border-ink/12 mt-12 text-sm text-ink-2 font-body pb-4">
      <p class="mb-4">
        本报由 GitHub Actions 自动生成 ·
        <a href="https://github.com/WuDuHuange/Gensokyo_Daily" target="_blank" rel="noopener noreferrer" class="hover:text-seal underline transition-colors">项目源码</a>
      </p>
      <div class="font-title text-4xl text-ink-3 mt-2 tracking-[0.3em] opacity-40">文 々。新聞</div>
      <div id="last-updated" class="text-xs text-ink-3 mt-4 font-mono"></div>
    </footer>
  </div>

  <!-- ============ 工具坞 ============
       旧版是 4 个圆钮常驻右下角，压在正文上，且没有「收起」的概念 ——
       读者在阅读时始终被 4 个控件占着视线。现在收成一个圆钮，
       点开才展开菜单。默认收起。

       ⚠️ #btn-to-top 的滚动显隐（motion.js 的 .is-visible）保持原样，
       它只是恰好被放进了菜单里：页面顶部时「回到报头」本就无意义，
       跟着菜单一起隐没反而更合理。 -->
  <div class="tool-dock" id="tool-dock">
    <div class="tool-dock__menu" id="tool-dock-menu">
      <button class="tool-btn" id="btn-ambient-toggle" type="button" aria-label="环境白噪音" style="display:none;">
        <span class="tool-btn__icon"><svg class="icon"><use href="#i-music" /></svg></span>
        <span class="tool-btn__tip">环境白噪音</span>
      </button>
      <button class="tool-btn" id="btn-sound-toggle" type="button" aria-label="音效开关">
        <span class="tool-btn__icon"><svg class="icon"><use href="#i-sound-off" /></svg></span>
        <span class="tool-btn__tip">开启音效</span>
      </button>
      <button class="tool-btn" id="btn-theme-toggle" type="button" aria-label="切换夜间模式">
        <span class="tool-btn__icon"><svg class="icon"><use href="#i-moon" /></svg></span>
        <span class="tool-btn__tip">夜读模式</span>
      </button>
      <button class="tool-btn to-top" id="btn-to-top" type="button" aria-label="回到报头">
        <span class="tool-btn__icon"><svg class="icon"><use href="#i-arrow-up" /></svg></span>
        <span class="tool-btn__tip">回到报头</span>
      </button>
    </div>

    <button class="tool-fab" id="btn-tool-toggle" type="button" aria-label="工具" aria-expanded="false" aria-controls="tool-dock-menu">
      <svg class="icon tool-fab__icon--open"><use href="#i-dots" /></svg>
      <svg class="icon tool-fab__icon--close"><use href="#i-close" /></svg>
    </button>
  </div>

  <!-- ============ 加载遮罩 · 报纸拆封 ============ -->
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-sheet" aria-hidden="true"></div>
    <p class="loading-caption">正在取信</p>
  </div>

  <script src="js/motion.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
